<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V25 FPS Booster</title>
<style>
body {
  background: #080d19;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.card {
  background: #131e30;
  padding: 22px;
  border-radius: 18px;
}
h1 { color: #00ffc8; }
button {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  background: #00ffc8;
  border: 0;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
}
p { line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
<h1>⚡ V25 FPS BOOSTER</h1>
<p>BGMI Performance Assistant</p>
<h2>Target: 90 FPS</h2>
<p id="status">Status: Ready</p>

<button onclick="guide()">Performance Guide</button>
<button onclick="tips()">BGMI Settings Guide</button>
<button onclick="info()">FPS Information</button>

<p>90 FPS tabhi milega jab BGMI aur device uska support karein.</p>
</div>

<script>
function guide() {
  document.getElementById("status").innerText =
  "Phone Settings mein Display > Refresh Rate kholkar High select karein.";
}
function tips() {
  alert("BGMI Settings > Graphics & Audio kholen. Smooth graphics aur available highest FPS select karein.");
}
function info() {
  alert("Vivo V25 5G mein 90Hz display hai. BGMI mein 90 FPS milna game support par depend karta hai.");
}
</script>
</body>
</html>
